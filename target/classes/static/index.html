<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Philologe | Latein & Griechisch</title>
    
    <style>
        body { background-color: #f8f9fa; }
        .translator-container { max-width: 800px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .result-area { background: #fff; border-left: 5px solid #0d6efd; padding: 20px; margin-top: 20px; min-height: 100px; border-radius: 5px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
        .spinner-border { display: none; margin-right: 10px; }
        /* Styling für die Markdown-Tabellen innerhalb des Ergebnisses */
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 12px; }
        th { background-color: #f1f3f5; }
    </style>
      <link href="/js/bootstrap.min.css" rel="stylesheet">
    <script src="/js/marked.min.js"></script>
</head>
<body>

<div class="container">
    <div class="translator-container">
        <h2 class="text-center mb-4">🏛️ AI Philologe</h2>
        
        <div class="row g-3">
            <!-- Zielsprache -->
            <div class="col-md-12">
                <label class="form-label font-weight-bold">Richtung & Sprache:</label>
                <select id="targetLang" class="form-select">
                    <option value="german">Nach Deutsch (aus Lat/Gr)</option>
                    <option value="latin">Nach Latein (aus Deutsch)</option>
                    <option value="greek">Nach Altgriechisch (aus Deutsch)</option>
                </select>
            </div>

            <!-- Textarea -->
            <div class="col-md-12">
                <label class="form-label font-weight-bold">Dein Text:</label>
                <textarea id="userInput" class="form-control" rows="5" placeholder="Satz oder Textabschnitt hier eingeben..."></textarea>
            </div>

            <!-- Button -->
            <div class="col-md-12 text-center">
                <button id="sendBtn" onclick="sendTranslation()" class="btn btn-primary btn-lg px-5">
                    <span id="loader" class="spinner-border spinner-border-sm" role="status"></span>
                    Übersetzen & Analysieren
                </button>
            </div>
        </div>

        <!-- Ergebnis-Bereich -->
        <div id="outputWrapper" class="mt-4" style="display:none;">
            <h5 class="font-weight-bold">Ergebnis:</h5>
            <div id="output" class="result-area"></div>
        </div>
    </div>
</div>

<script>
    async function sendTranslation() {
        const input = document.getElementById('userInput');
        const target = document.getElementById('targetLang').value;
        const output = document.getElementById('output');
        const outputWrapper = document.getElementById('outputWrapper');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('sendBtn');

        if (!input.value.trim()) return;

        // UI-Zustand: Laden
        loader.style.display = "inline-block";
        btn.disabled = true;
        outputWrapper.style.display = "block";
        output.innerHTML = "<p class='text-muted'>KI analysiert den Text, bitte warten...</p>";

        try {
            const response = await fetch(`/translate?text=${encodeURIComponent(input.value)}&target=${target}`);
            const result = await response.text();
            
            // Markdown in HTML umwandeln
            output.innerHTML = marked.parse(result);
        } catch (error) {
            output.innerHTML = "<div class='alert alert-danger'>Verbindungsfehler zum Server.</div>";
        } finally {
            loader.style.display = "none";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
